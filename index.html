<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet de Recettes</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-orange-50 font-['Inter']">

  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-8 text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-orange-600">
        Mon carnet de recettes
      </h1>

      <p class="mt-2 text-gray-500 text-sm sm:text-base">
        Découvrez et partagez vos recettes préférées
      </p>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xl mx-auto p-4">
      <input type="text" id="search-input" placeholder="Rechercher une recette..."
        class="flex-1 min-w-0 px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">

      <button id="search-btn"
        class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition">
        Rechercher
      </button>
    </div>
    
    <div class="mb-6 flex items-center justify-between">
      <h1 class="text-xl font-bold text-gray-800">
        Toutes les recettes
      </h1>

      <p id="recipes-count" class="bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-semibold"></p>
    </div>

    <div id="recipes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

    <div id="empty-message" class="hidden col-span-full flex flex-col items-center gap-4 py-10">
    <p class="text-gray-500 text-lg font-medium">
        Aucune recette trouvée.
    </p>

    <button id="show-all-btn"
        class="px-6 py-3 bg-orange-600 text-white font-semibold rounded-xl hover:bg-orange-700 transition">
        Voir toutes les recettes
    </button>
</div>

  </main>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
