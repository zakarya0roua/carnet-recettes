
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de Recettes</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-orange-50 font-['Inter'] text-gray-800">

    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-orange-600">
                Mon carnet de recettes
            </h1>

            <p class="mt-2 text-gray-500 text-sm sm:text-base">
                Découvrez et partagez vos recettes préférées
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Nombre de recettes -->
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800">
                Toutes les recettes
            </h1>

            <p id="recipes-count"class="bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-semibold"></p>
        </div>

        <!-- Conteneur des recettes -->
        <div id="recipes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>

    </main>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
